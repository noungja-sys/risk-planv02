<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>RISK_PLAN.v2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: #fcfcfc;
      color: #1e293b;
      -webkit-tap-highlight-color: transparent;
    }
    .main-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
    }
    input {
      font-size: 16px !important;
      font-family: 'JetBrains Mono', monospace;
      background: #ffffff !important;
      border: 1px solid #cbd5e1 !important;
      appearance: none;
      border-radius: 12px !important;
    }
    input:focus {
      border-color: #0ea5e9 !important;
      outline: none;
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
    }
    .btn-active:active {
      transform: scale(0.96);
      background-color: #000000;
    }
  </style>
</head>
<body class="flex items-start md:items-center justify-center min-h-screen p-4 md:p-8">

  <div class="main-card w-full max-w-lg p-6 md:p-10 rounded-[24px] shadow-sm">
    <header class="mb-8 flex justify-between items-end">
      <div>
        <h1 class="text-lg font-bold tracking-tighter text-slate-900">RISK_PLAN.v2</h1>
        <p class="text-[10px] text-slate-400 uppercase tracking-widest">Mobile Optimized</p>
      </div>
      <div class="text-[10px] font-bold text-sky-500 border border-sky-200 px-2 py-1 rounded">
        LIVE_DATA
      </div>
    </header>

    <form id="riskForm" class="space-y-5">
      <div>
        <label class="text-[11px] font-bold uppercase text-slate-500 ml-1 mb-2 block">Port Capital</label>
        <input type="number" id="capital" inputmode="decimal" placeholder="0.00" step="any" min="0" class="w-full px-4 py-4 text-slate-900" required>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-[11px] font-bold uppercase text-slate-500 ml-1 mb-2 block">Risk %</label>
          <input type="number" id="riskOfRuin" inputmode="decimal" value="1" step="any" min="0" class="w-full px-4 py-4 text-slate-900" required>
        </div>
        <div>
          <label class="text-[11px] font-bold uppercase text-slate-500 ml-1 mb-2 block">SL %</label>
          <input type="number" id="stopLoss" inputmode="decimal" placeholder="5" step="any" min="0" class="w-full px-4 py-4 text-slate-900" required>
        </div>
      </div>

      <div>
        <label class="text-[11px] font-bold uppercase text-slate-500 ml-1 mb-2 block">Leverage (x)</label>
        <input type="number" id="leverage" inputmode="numeric" value="1" min="1" step="any" class="w-full px-4 py-4 text-slate-900" required>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-slate-900 text-white font-bold py-5 rounded-2xl transition-all btn-active mt-2">
        CALCULATE_POSITION
      </button>
    </form>

    <p id="errorMsg" class="mt-4 text-[11px] font-bold text-red-500 hidden"></p>

    <div id="result" class="mt-8 pt-6 border-t border-slate-100 hidden">
      <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="p-4 bg-slate-50 rounded-2xl">
          <span class="text-[10px] font-bold text-slate-400 block mb-1">RISK (1R)</span>
          <span id="res1R" class="text-sm font-bold text-red-500"></span>
        </div>
        <div class="p-4 bg-slate-50 rounded-2xl">
          <span class="text-[10px] font-bold text-slate-400 block mb-1">POS_SIZE</span>
          <span id="resPos" class="text-sm font-bold text-blue-600"></span>
        </div>
      </div>

      <div class="p-5 bg-emerald-50 border border-emerald-100 rounded-2xl flex justify-between items-center">
        <span class="text-[11px] font-bold text-emerald-700">REQUIRED_MARGIN</span>
        <span id="resMargin" class="text-xl font-bold text-emerald-600"></span>
      </div>
    </div>
  </div>

  <script>
    const money = new Intl.NumberFormat('en-US', {
      style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2
    });

    function calculateRisk({ capital, riskOfRuin, stopLoss, leverage }) {
      const oneR = capital * (riskOfRuin / 100);        // เงินที่ยอมเสียต่อไม้
      const positionSize = oneR / (stopLoss / 100);      // ขนาดสถานะรวม
      const margin = positionSize / leverage;            // มาร์จิ้นที่ต้องวาง
      return {
        oneR: money.format(oneR),
        positionSize: money.format(positionSize),
        margin: money.format(margin)
      };
    }

    const errorMsg = document.getElementById('errorMsg');

    document.getElementById('riskForm').onsubmit = function (e) {
      e.preventDefault();
      const resultDiv = document.getElementById('result');

      const data = {
        capital: parseFloat(document.getElementById('capital').value),
        riskOfRuin: parseFloat(document.getElementById('riskOfRuin').value),
        stopLoss: parseFloat(document.getElementById('stopLoss').value),
        leverage: parseFloat(document.getElementById('leverage').value)
      };

      const invalid =
        !Number.isFinite(data.capital) || data.capital <= 0 ||
        !Number.isFinite(data.riskOfRuin) || data.riskOfRuin <= 0 ||
        !Number.isFinite(data.stopLoss) || data.stopLoss <= 0 ||
        !Number.isFinite(data.leverage) || data.leverage < 1;

      if (invalid) {
        resultDiv.classList.add('hidden');
        errorMsg.innerText = 'ERR: ใส่ตัวเลขให้ครบ (SL% และ Risk% ต้องมากกว่า 0, Leverage ≥ 1)';
        errorMsg.classList.remove('hidden');
        return;
      }

      errorMsg.classList.add('hidden');
      const res = calculateRisk(data);

      document.getElementById('res1R').innerText = res.oneR;
      document.getElementById('resPos').innerText = res.positionSize;
      document.getElementById('resMargin').innerText = res.margin;
      resultDiv.classList.remove('hidden');
    };
  </script>
</body>
</html>
